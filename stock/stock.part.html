<style>
/* ---------- app shell: bottom tabs ---------- */
.appnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.appnav button{flex:0 1 200px;border:0;background:transparent;color:var(--muted);font:600 13px var(--sans);padding:8px 10px;border-radius:14px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.appnav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
.appnav svg{width:24px;height:24px}
.dot{position:absolute;top:2px;right:calc(50% - 26px);min-width:20px;height:20px;border-radius:10px;background:#C2410C;color:#fff;font:700 11px/20px var(--sans);text-align:center;padding:0 5px}
body{padding-bottom:110px!important}
/* ---------- stock ---------- */
#view-stock{margin-top:18px}
.st-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font:600 13px var(--sans);cursor:pointer;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip.warn{border-color:#C2410C}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.st-tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:999px;overflow-x:auto}
.st-tabs button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.st-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.st-list{display:flex;flex-direction:column;gap:0;margin-top:10px}
.st-cat{font:400 24px/1.1 var(--serif);margin:18px 0 6px}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.st-name{background:none;border:0;padding:0;text-align:left;color:var(--ink);font:500 15px/1.3 var(--sans);cursor:pointer;min-width:0}
.st-name small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.tag.low{background:#FDE7DA;color:#9A3412}.tag.out{background:#9A3412;color:#fff}.tag.ord{background:var(--chip);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:600 24px var(--sans);cursor:pointer}
.stepper output{min-width:40px;text-align:center;font:600 20px var(--sans);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,14,82,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--panel);color:var(--ink);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big button{min-height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px var(--sans);cursor:pointer}
.big button[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.amt{display:flex;align-items:center;justify-content:center;gap:18px}
.amt output{font:400 54px var(--serif);min-width:70px;text-align:center}
.amt button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--ink);font:600 26px var(--sans);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 13px var(--sans);max-width:calc(100vw - 32px)}
.ordgrp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:var(--panel)}
.ordrow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ordrow:last-child{border-bottom:0}
.ordrow input{width:64px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 16px var(--sans);text-align:center}
.bt{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bt img,.bt .noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--chip)}
.exp-ok{color:var(--muted)}.exp-soon{color:#B45309;font-weight:700}.exp-past{color:#B91C1C;font-weight:700}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.money div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.money b{display:block;font:400 34px var(--serif);font-variant-numeric:tabular-nums}
.alert{border:1px solid var(--line);border-left:4px solid #C2410C;border-radius:12px;padding:12px;margin-top:10px;background:var(--panel)}
.alert p{margin:6px 0}
.connect{max-width:520px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:400 16px var(--sans)}
</style>

<section id="view-stock" hidden>
  <div class="st-head">
    <div><div class="eyebrow">Kora Lawler Aesthetics · clinic stock</div><h1 style="font-size:clamp(34px,6vw,48px)">Stock</h1></div>
    <div class="tools"><span class="hint" id="st-sync" style="margin-right:6px"></span><button class="btn small" id="st-refresh">Refresh</button></div>
  </div>
  <div id="st-connect" class="card connect" hidden>
    <h2>Connect to the stock sheet</h2>
    <p class="hint" style="margin:6px 0 12px">Do this once on each phone or iPad. Jo can send a ready-made link instead from <strong>Share with the team</strong>.</p>
    <div class="form" style="gap:12px">
      <label class="f">Stock link (from the Google script)<input id="st-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="f">PIN<input id="st-pin" inputmode="numeric" autocomplete="off"></label>
      <label class="f">Your first name (shows who changed what)<input id="st-who" autocomplete="off"></label>
      <button class="btn primary" id="st-go">Connect</button>
      <p class="status" id="st-cmsg" style="text-align:left"></p>
    </div>
  </div>
  <div id="st-main" hidden>
    <div class="chips" id="st-chips"></div>
    <div class="st-tabs" role="tablist" id="st-tabs">
      <button role="tab" data-t="shelf" aria-selected="true">Shelf</button>
      <button role="tab" data-t="order">To order</button>
      <button role="tab" data-t="batches">Batches &amp; expiry</button>
      <button role="tab" data-t="count">Stock count</button>
      <button role="tab" data-t="alerts">Alerts</button>
      <button role="tab" data-t="money">Money</button>
      <button role="tab" data-t="team">Settings</button>
    </div>
    <div id="st-body"></div>
  </div>
</section>

<nav class="appnav" aria-label="App sections">
  <button id="nav-videos" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg>Routine videos</button>
  <button id="nav-stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>Stock<span class="dot" id="nav-dot" hidden></span></button>
</nav>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>'€'+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const LS={get(k){try{return localStorage.getItem('kl-st-'+k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem('kl-st-'+k,v)}catch(e){}}};
let DATA=null,TAB='shelf',FILTER='All',Q='';
const SECTIONS=['Skincare (retail)','Clinic supplies','Treatment products'];
const REASONS_DOWN=['Sold','Used in clinic','Gift','Damaged'];
// ---------- nav ----------
function show(which){const st=which==='stock';$('#view-make').hidden=st;$('#view-stock').hidden=!st;$('#nav-videos').setAttribute('aria-current',st?'false':'page');$('#nav-stock').setAttribute('aria-current',st?'page':'false');
  document.querySelector('header.top').hidden=st;if(st&&!DATA)load();try{history.replaceState(null,'',st?'#stock':'#videos')}catch(e){}window.scrollTo(0,0)}
$('#nav-videos').onclick=()=>show('videos');$('#nav-stock').onclick=()=>show('stock');
// ---------- connection ----------
function conn(){return{url:LS.get('url'),pin:LS.get('pin'),who:LS.get('who')}}
function readLink(){const h=location.hash;if(!h.startsWith('#connect'))return false;const p=new URLSearchParams(h.slice(h.indexOf('?')+1));
  if(p.get('u'))LS.set('url',p.get('u'));if(p.get('p'))LS.set('pin',p.get('p'));try{history.replaceState(null,'','#stock')}catch(e){}return true}
function toast(t,ms){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,ms||2600)}
async function api(body){const c=conn();if(!c.url)throw new Error('Not connected');
  let r;if(body){r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pin:c.pin,who:c.who})})}
  else{r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'pin='+encodeURIComponent(c.pin)+'&t='+Date.now())}
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Something went wrong');return j}
async function load(){const c=conn();if(!c.url||!c.pin){showConnect();return}if(!c.who){showConnect('Nearly there. Add your first name and tap Connect.');return}
  $('#st-sync').textContent='Loading…';
  try{DATA=await api();LS.set('cache',JSON.stringify(DATA));$('#st-connect').hidden=true;$('#st-main').hidden=false;$('#st-sync').textContent='Up to date';render()}
  catch(e){const cached=LS.get('cache');if(cached&&String(e.message)!=='Wrong PIN'){DATA=JSON.parse(cached);$('#st-main').hidden=false;$('#st-connect').hidden=true;$('#st-sync').textContent='Offline: showing last saved numbers';render()}
    else{showConnect(e.message==='Wrong PIN'?'That PIN doesn’t match the one in the stock sheet.':'Couldn’t reach the stock sheet. Check you pasted the Web app link (ends /exec), that it was deployed with access “Anyone”, and your internet.')}}}
function showConnect(msg){$('#st-main').hidden=true;$('#st-connect').hidden=false;const c=conn();$('#st-url').value=c.url;$('#st-pin').value=c.pin;$('#st-who').value=c.who;$('#st-cmsg').textContent=msg||''}
$('#st-go').onclick=()=>{const u=$('#st-url').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)){$('#st-cmsg').textContent=/docs\.google\.com/.test(u)?'That’s the Google Sheet’s own link. Use the Web app link from Apps Script › Deploy instead (it starts https://script.google.com/macros/s/ and ends /exec).':'That doesn’t look like the Web app link. It starts https://script.google.com/macros/s/ and ends /exec.';return}LS.set('url',$('#st-url').value.trim());LS.set('pin',$('#st-pin').value.trim());LS.set('who',$('#st-who').value.trim());load()};
$('#st-refresh').onclick=load;
async function act(body,okMsg){$('#st-sync').textContent='Saving…';try{DATA=await api(body);LS.set('cache',JSON.stringify(DATA));$('#st-sync').textContent='Saved';render();if(okMsg)toast(okMsg)}
  catch(e){$('#st-sync').textContent='Not saved';toast('Not saved: '+e.message+'. Try again.',4000);load()}}
// ---------- derived ----------
const P=()=>DATA?DATA.products:[];
const reorderAt=p=>p.reorderAt===''||p.reorderAt==null?DATA.settings.reorderDefault:Number(p.reorderAt);
const needsOrder=p=>Number(p.qty)<=reorderAt(p)&&!(Number(p.onOrder)>0);
const suggest=p=>Math.max(1,(Number(p.target)||reorderAt(p)+4)-Number(p.qty)-Number(p.onOrder||0));
function daysTo(d){if(!d)return null;const t=new Date(d+'T00:00:00');if(isNaN(t))return null;return Math.round((t-new Date(new Date().toDateString()))/86400000)}
function expiring(){return (DATA.batches||[]).map(b=>({...b,days:daysTo(b.expiry)})).filter(b=>b.days!=null&&b.days<=DATA.settings.expiryWarnDays)}
function countDue(){if(!DATA.lastCount)return true;const d=new Date(DATA.lastCount.replace(' ','T'));return (Date.now()-d)/86400000>=DATA.settings.countEveryDays}
function badges(){if(!DATA)return 0;return P().filter(needsOrder).length+expiring().length+(DATA.alerts||[]).length+(countDue()?1:0)}
function updDot(){const n=badges();const d=$('#nav-dot');d.hidden=!n;d.textContent=n>9?'9+':n}
// ---------- render ----------
function render(){updDot();const ord=P().filter(needsOrder).length,ex=expiring().length,al=(DATA.alerts||[]).length,cd=countDue();
  $('#st-chips').innerHTML=`<button class="chip ${ord?'warn':''}" data-go="order">To order <b>${ord}</b></button><button class="chip ${ex?'warn':''}" data-go="batches">Expiring within ${DATA.settings.expiryWarnDays} days <b>${ex}</b></button><button class="chip ${al?'warn':''}" data-go="alerts">Recall alerts <b>${al}</b></button><button class="chip ${cd?'warn':''}" data-go="count">${cd?'Stock count due':'Count done '+esc(String(DATA.lastCount).slice(0,10))}</button>`;
  document.querySelectorAll('#st-tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===TAB));
  ({shelf,order,batches,count,alerts,money,team})[TAB]()}
$('#st-chips').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){TAB=b.dataset.go;render()}});
$('#st-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){TAB=b.dataset.t;render()}});
function grouped(list){const out={};list.forEach(p=>{const k=(p.section||'Other')+'||'+(p.category||'Other');(out[k]=out[k]||[]).push(p)});return out}
function shelf(){const secs=['All',...SECTIONS];
  let list=P().filter(p=>(FILTER==='All'||p.section===FILTER)&&(!Q||p.name.toLowerCase().includes(Q.toLowerCase())));
  const g=grouped(list);let h=`<div class="tools" style="margin-top:14px">${secs.map(s=>`<button class="chip ${FILTER===s?'on':''}" data-f="${esc(s)}">${esc(s==='Skincare (retail)'?'Skincare':s)}</button>`).join('')}</div>
   <div class="tools" style="margin-top:10px"><input class="search" id="st-q" placeholder="Search products" value="${esc(Q)}" aria-label="Search products" style="flex:1"><button class="btn small primary" id="st-add">+ Add product</button></div><div class="st-list">`;
  let lastSec='';for(const k of Object.keys(g)){const [sec,cat]=k.split('||');if(sec!==lastSec&&FILTER==='All'){h+=`<div class="eyebrow" style="margin-top:22px">${esc(sec)}</div>`;lastSec=sec}h+=`<h3 class="st-cat">${esc(cat)}</h3>`;
    for(const p of g[k]){const q=Number(p.qty);const tag=q===0?'<span class="tag out">Out</span>':q<=reorderAt(p)?'<span class="tag low">Low</span>':'';const oo=Number(p.onOrder)>0?`<span class="tag ord">${p.onOrder} on order</span>`:'';
      h+=`<div class="st-row"><button class="st-name" data-edit="${esc(p.id)}">${esc(p.name)}${tag}${oo}<small>${esc(p.supplier||'No supplier')}${p.price!==''?' · '+eur(p.price):''}</small></button>
      <div class="stepper"><button data-down="${esc(p.id)}" aria-label="Take one off ${esc(p.name)}">−</button><output>${q}</output><button data-up="${esc(p.id)}" aria-label="Add to ${esc(p.name)}">+</button></div></div>`}}
  if(!list.length)h+='<p class="hint" style="margin-top:16px">Nothing here yet. Tap + Add product.</p>';
  $('#st-body').innerHTML=h+'</div>';
  const qi=$('#st-q');qi.oninput=e=>{Q=e.target.value;const pos=qi.selectionStart;shelf();const n=$('#st-q');n.focus();n.setSelectionRange(pos,pos)};
  $('#st-add').onclick=()=>editProduct(null)}
$('#st-body').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.f){FILTER=t.dataset.f;shelf()}
  else if(t.dataset.down)moveSheet(t.dataset.down,-1);else if(t.dataset.up)moveSheet(t.dataset.up,1);else if(t.dataset.edit)editProduct(t.dataset.edit)});
// ---------- sheets ----------
function sheet(html){const w=document.createElement('div');w.className='sheet';w.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`;w.addEventListener('click',e=>{if(e.target===w)w.remove()});document.body.appendChild(w);return w}
function moveSheet(id,dir){const p=P().find(x=>x.id===id);if(!p)return;let n=1,reason=dir<0?'Sold':(Number(p.onOrder)>0?'Received':'Received');if(dir>0&&Number(p.onOrder)>0)n=Number(p.onOrder);
  const reasons=dir<0?REASONS_DOWN:['Received','Correction'];
  const w=sheet(`<h2>${dir<0?'Taking off':'Adding'}: ${esc(p.name)}</h2><p class="hint">Now in stock: ${p.qty}${Number(p.onOrder)>0?' · '+p.onOrder+' on order':''}</p>
   <div class="big">${reasons.map(r=>`<button data-r="${r}" aria-pressed="${r===reason}">${r==='Received'?'Delivery arrived':r}</button>`).join('')}</div>
   <div class="amt"><button data-a="-1" aria-label="Less">−</button><output id="mv-n">${n}</output><button data-a="1" aria-label="More">+</button></div>
   <div class="tools" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`);
  w.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.r){reason=b.dataset.r;w.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
    if(b.dataset.a){n=Math.max(1,n+Number(b.dataset.a));w.querySelector('#mv-n').textContent=n}
    if(b.hasAttribute('data-x'))w.remove();
    if(b.hasAttribute('data-ok')){w.remove();act({action:'move',id,change:dir*n,reason},(dir<0?'−':'+')+n+' '+p.name.split(',')[0])}})}
function editProduct(id){const p=id?P().find(x=>x.id===id):{section:FILTER!=='All'?FILTER:'Skincare (retail)',category:'',name:'',supplier:'',cost:'',price:'',reorderAt:DATA.settings.reorderDefault,target:6,recallWords:'',qty:0};
  const sup=DATA.settings.suppliers;const cats=[...new Set(P().map(x=>x.category).filter(Boolean))];
  const mine=(DATA.batches||[]).filter(b=>id&&b.id===id);
  const w=sheet(`<h2>${id?'Edit product':'New product'}</h2>
   <label class="f">Name<input id="ep-name" value="${esc(p.name)}"></label>
   <div class="row"><label class="f">Section<select id="ep-sec">${SECTIONS.map(s=>`<option ${s===p.section?'selected':''}>${s}</option>`).join('')}</select></label>
   <label class="f">Category<input id="ep-cat" list="ep-cats" value="${esc(p.category)}"><datalist id="ep-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label></div>
   <label class="f">Supplier<select id="ep-sup"><option value="">Choose…</option>${[...new Set([...sup,p.supplier].filter(Boolean))].map(s=>`<option ${s===p.supplier?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
   <div class="row"><label class="f">Cost each (€)<input id="ep-cost" inputmode="decimal" value="${esc(p.cost)}"></label><label class="f">Sell price (€)<input id="ep-price" inputmode="decimal" value="${esc(p.price)}" placeholder="Blank if not sold"></label></div>
   <p class="hint" id="ep-profit"></p>
   <div class="row"><label class="f">Order when down to<input id="ep-ro" inputmode="numeric" value="${esc(p.reorderAt)}"></label><label class="f">Fill back up to<input id="ep-tg" inputmode="numeric" value="${esc(p.target)}"></label></div>
   <label class="f">Recall check words (brand or medicine name, comma between)<input id="ep-rw" value="${esc(p.recallWords)}"></label>
   ${id?'':`<label class="f">How many in stock now<input id="ep-qty" inputmode="numeric" value="0"></label>`}
   ${id?`<div><h3>Batches</h3>${mine.length?mine.map(b=>`<p class="hint">${esc(b.batch||'No batch no.')} · expires ${esc(b.expiry||'?')}</p>`).join(''):'<p class="hint">None yet.</p>'}<button class="btn small" id="ep-batch">+ Add batch and expiry</button></div>`:''}
   <div class="tools" style="justify-content:space-between">${id?'<button class="btn small" id="ep-hide">Stop tracking</button>':'<span></span>'}<span class="tools"><button class="btn" data-x>Cancel</button><button class="btn primary" id="ep-save">Save</button></span></div>`);
  const prof=()=>{const c=parseFloat(w.querySelector('#ep-cost').value),s=parseFloat(w.querySelector('#ep-price').value);w.querySelector('#ep-profit').textContent=(c>=0&&s>0)?`Profit ${eur(s-c)} each · margin ${Math.round((s-c)/s*100)}%`:''};prof();
  w.addEventListener('input',prof);w.querySelector('[data-x]').onclick=()=>w.remove();
  if(id)w.querySelector('#ep-batch').onclick=()=>{w.remove();batchSheet(id)};
  if(id)w.querySelector('#ep-hide').onclick=()=>{w.remove();act({action:'saveProduct',product:{id,active:'no'}},'No longer tracked. Set active to yes in the sheet to bring it back.')};
  w.querySelector('#ep-save').onclick=()=>{const v=s=>w.querySelector(s).value.trim();const name=v('#ep-name');if(!name){toast('Add a name first');return}
    const prod={id:id||undefined,name,section:v('#ep-sec'),category:v('#ep-cat')||'Other',supplier:v('#ep-sup'),cost:v('#ep-cost'),price:v('#ep-price'),reorderAt:v('#ep-ro'),target:v('#ep-tg'),recallWords:v('#ep-rw')};
    if(!id)prod.qty=v('#ep-qty');w.remove();act({action:'saveProduct',product:prod},'Saved')}}
// ---------- order ----------
function order(){const need=P().filter(needsOrder),on=P().filter(p=>Number(p.onOrder)>0);const by={};need.forEach(p=>{(by[p.supplier||'No supplier']=by[p.supplier||'No supplier']||[]).push(p)});
  let h='';if(!need.length)h+='<p class="hint" style="margin-top:16px">Nothing needs ordering right now.</p>';
  for(const s of Object.keys(by)){h+=`<div class="ordgrp"><div class="sect-h"><h3>${esc(s)}</h3><button class="btn small" data-copy="${esc(s)}">Copy order list</button></div>`;
    by[s].forEach(p=>{h+=`<div class="ordrow"><div>${esc(p.name)}<small class="hint" style="display:block">${p.qty} left${p.cost!==''?' · '+eur(p.cost)+' each':''}</small></div><input inputmode="numeric" value="${suggest(p)}" data-q="${esc(p.id)}" aria-label="How many to order"><button class="btn small primary" data-ordered="${esc(p.id)}">Ordered</button></div>`});
    const tot=by[s].reduce((a,p)=>a+(Number(p.cost)||0)*suggest(p),0);if(tot)h+=`<p class="hint">About ${eur(tot)} at cost</p>`;h+='</div>'}
  if(on.length){h+='<h3 class="st-cat">On the way</h3>';on.forEach(p=>{h+=`<div class="ordrow"><div>${esc(p.name)}<small class="hint" style="display:block">${p.onOrder} ordered from ${esc(p.supplier||'?')}</small></div><span></span><button class="btn small" data-up="${esc(p.id)}">Arrived</button></div>`})}
  $('#st-body').innerHTML=h;
  $('#st-body').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const s=b.dataset.copy;const lines=by[s].map(p=>{const q=$('#st-body').querySelector(`[data-q="${CSS.escape(p.id)}"]`).value;return q+' × '+p.name}).join('\n');
    const t=`Order for Kora Lawler Aesthetics (${s}):\n${lines}`;try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into your order or email.')}catch(e){toast('Couldn’t copy on this device')}});
  $('#st-body').querySelectorAll('[data-ordered]').forEach(b=>b.onclick=()=>{const id=b.dataset.ordered;const q=$('#st-body').querySelector(`[data-q="${CSS.escape(id)}"]`).value;act({action:'ordered',id,qty:q},'Marked as ordered')})}
// ---------- batches ----------
function batches(){const list=(DATA.batches||[]).map(b=>({...b,days:daysTo(b.expiry)})).sort((a,b)=>(a.days??99999)-(b.days??99999));
  let h=`<div class="tools" style="margin-top:14px"><button class="btn primary" id="bt-add">+ Add batch and expiry</button></div><p class="hint" style="margin-top:8px">Take a photo of the batch number and expiry date on the box. You’ll get an alert ${DATA.settings.expiryWarnDays} days before it expires.</p>`;
  if(!list.length)h+='<p class="hint">No batches recorded yet.</p>';
  list.forEach(b=>{const cls=b.days==null?'exp-ok':b.days<0?'exp-past':b.days<=DATA.settings.expiryWarnDays?'exp-soon':'exp-ok';const when=b.days==null?'No expiry date':b.days<0?'Expired '+(-b.days)+' days ago':b.days===0?'Expires today':'Expires in '+b.days+' days';
    const img=b.photo?`<a href="https://drive.google.com/file/d/${encodeURIComponent(b.photo)}/view" target="_blank" rel="noopener"><img alt="Photo of batch label" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(b.photo)}&sz=w200"></a>`:'<div class="noimg"></div>';
    h+=`<div class="bt">${img}<div><strong>${esc(b.name)}</strong><small class="hint" style="display:block">Batch ${esc(b.batch||'?')} · ${esc(b.expiry||'')}</small><span class="${cls}">${when}</span></div><button class="btn small" data-rmb="${esc(b.key)}">Used up</button></div>`});
  $('#st-body').innerHTML=h;$('#bt-add').onclick=()=>batchSheet(null);
  $('#st-body').querySelectorAll('[data-rmb]').forEach(b=>b.onclick=()=>act({action:'removeBatch',key:b.dataset.rmb},'Batch removed'))}
function batchSheet(id){let photo=null;const w=sheet(`<h2>Add batch and expiry</h2>
   <label class="f">Product<select id="bs-p">${P().map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
   <div class="tools"><label class="btn primary" for="bs-cam">Take photo of label</label><input id="bs-cam" type="file" accept="image/*" capture="environment" hidden><span class="hint" id="bs-ph">No photo yet</span></div>
   <img id="bs-prev" alt="" hidden style="max-height:180px;border-radius:12px;object-fit:contain">
   <div class="row"><label class="f">Batch / lot number<input id="bs-b" autocapitalize="characters"></label><label class="f">Expiry date<input id="bs-e" type="date"></label></div>
   <label class="f">How many from this batch (optional)<input id="bs-q" inputmode="numeric"></label>
   <div class="tools" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" id="bs-save">Save</button></div>`);
  w.querySelector('[data-x]').onclick=()=>w.remove();
  w.querySelector('#bs-cam').onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url});if(!im){toast('Couldn’t open that photo');return}
    const c=document.createElement('canvas');const s=Math.min(1,1400/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',0.8);photo=d.split(',')[1];w.querySelector('#bs-prev').src=d;w.querySelector('#bs-prev').hidden=false;w.querySelector('#bs-ph').textContent='Photo added'};
  w.querySelector('#bs-save').onclick=()=>{const v=s=>w.querySelector(s).value.trim();if(!v('#bs-e')&&!v('#bs-b')){toast('Add the batch number or expiry date');return}
    w.remove();act({action:'addBatch',id:v('#bs-p'),batch:v('#bs-b'),expiry:v('#bs-e'),qty:v('#bs-q'),photo,mime:'image/jpeg'},'Batch saved')}}
// ---------- count ----------
function count(){const list=P();let h=`<p class="hint" style="margin-top:14px">Every ${DATA.settings.countEveryDays} days, go along the shelf and type in what’s really there. ${DATA.lastCount?'Last count: '+esc(DATA.lastCount)+'.':'No count done yet.'}</p><div class="st-list">`;
  const g=grouped(list);for(const k of Object.keys(g)){h+=`<h3 class="st-cat">${esc(k.split('||')[1])}</h3>`;g[k].forEach(p=>{h+=`<div class="st-row"><span>${esc(p.name)}</span><div class="stepper"><button data-cd="${esc(p.id)}" aria-label="One less">−</button><output data-c="${esc(p.id)}">${p.qty}</output><button data-cu="${esc(p.id)}" aria-label="One more">+</button></div></div>`})}
  h+=`</div><div class="tools" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="cnt-save">Save count</button></div>`;$('#st-body').innerHTML=h;
  $('#st-body').querySelectorAll('[data-cd],[data-cu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.cd||b.dataset.cu;const o=$('#st-body').querySelector(`[data-c="${CSS.escape(id)}"]`);o.textContent=Math.max(0,Number(o.textContent)+(b.dataset.cd?-1:1))});
  $('#cnt-save').onclick=()=>{const counts={};$('#st-body').querySelectorAll('[data-c]').forEach(o=>counts[o.dataset.c]=Number(o.textContent));act({action:'count',counts},'Count saved. Thanks!')}}
// ---------- alerts ----------
function alerts(){const al=DATA.alerts||[],ex=expiring();let h=`<p class="hint" style="margin-top:14px">Recall check runs on the 1st and 15th of each month against the HPRA safety notices. ${DATA.settings.lastScan?'Last check: '+esc(DATA.settings.lastScan)+'.':'Not run yet.'} It looks for your product and batch words, so always read the notice itself.</p>
  <button class="btn small" id="al-scan">Check HPRA now</button>`;
  if(!al.length&&!ex.length)h+='<p class="hint" style="margin-top:14px">No alerts. All clear.</p>';
  ex.forEach(b=>{h+=`<div class="alert"><strong>${b.days<0?'Expired':'Expiring soon'}: ${esc(b.name)}</strong><p>Batch ${esc(b.batch||'?')} · ${esc(b.expiry)} (${b.days<0?(-b.days)+' days ago':'in '+b.days+' days'})</p><button class="btn small" data-rmb="${esc(b.key)}">Used up or thrown out</button></div>`});
  al.forEach(a=>{h+=`<div class="alert"><strong>${esc(a.type)}${a.name?': '+esc(a.name):''}</strong><p>${esc(a.message)}</p>${a.link?`<p><a href="${esc(a.link)}" target="_blank" rel="noopener">Open the HPRA page</a></p>`:''}<button class="btn small" data-done="${esc(a.key)}">Checked, all fine</button></div>`});
  $('#st-body').innerHTML=h;$('#al-scan').onclick=()=>act({action:'scanNow'},'Check finished');
  $('#st-body').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>act({action:'doneAlert',key:b.dataset.done},'Cleared'));
  $('#st-body').querySelectorAll('[data-rmb]').forEach(b=>b.onclick=()=>act({action:'removeBatch',key:b.dataset.rmb},'Batch removed'))}
// ---------- money ----------
function money(){const list=P();let atCost=0,atPrice=0,noCost=0;list.forEach(p=>{const q=Number(p.qty)||0;if(p.cost==='')noCost++;else atCost+=q*Number(p.cost);if(p.price!=='')atPrice+=q*Number(p.price)});
  const sold=list.filter(p=>p.price!==''&&p.cost!=='');
  let h=`<div class="money"><div><span class="hint">Stock value at cost</span><b>${eur(atCost)}</b></div><div><span class="hint">Retail value on the shelf</span><b>${eur(atPrice)}</b></div><div><span class="hint">Profit if it all sells</span><b>${eur(sold.reduce((a,p)=>a+(Number(p.qty)||0)*(Number(p.price)-Number(p.cost)),0))}</b></div></div>`;
  if(noCost)h+=`<p class="hint" style="margin-top:10px">${noCost} products have no cost price yet, so these totals are incomplete. Tap a product on the Shelf to add its cost.</p>`;
  h+='<div class="tbl"><table><thead><tr><th>Product</th><th>Cost</th><th>Price</th><th>Profit each</th><th>Margin</th><th>In stock</th></tr></thead><tbody>'+list.filter(p=>p.price!=='').map(p=>{const c=p.cost===''?null:Number(p.cost),s=Number(p.price);return `<tr><td>${esc(p.name)}</td><td>${c==null?'–':eur(c)}</td><td>${eur(s)}</td><td>${c==null?'–':eur(s-c)}</td><td>${c==null||!s?'–':Math.round((s-c)/s*100)+'%'}</td><td>${p.qty}</td></tr>`}).join('')+'</tbody></table></div>';
  $('#st-body').innerHTML=h}
// ---------- team ----------
function team(){const c=conn();$('#st-body').innerHTML=`<div class="card" style="margin-top:14px"><h2>Share with the team</h2><p class="hint" style="margin:6px 0 12px">Sends a link that connects another phone to the stock in one tap. Only send it to people who should see costs and stock.</p>
   <button class="btn primary" id="tm-share">Share connect link</button></div>
   <div class="card" style="margin-top:14px"><h2>This device</h2><label class="f">Your first name<input id="tm-who" value="${esc(c.who)}"></label><div class="tools" style="margin-top:10px"><button class="btn small" id="tm-save">Save name</button><button class="btn small" id="tm-out">Disconnect this device</button></div>
   <p class="hint" style="margin-top:10px">Order level, count frequency, expiry warning, suppliers and the PIN are in the Settings tab of the KL Stock Google Sheet.</p></div>`;
  $('#tm-save').onclick=()=>{LS.set('who',$('#tm-who').value.trim());toast('Saved')};
  $('#tm-out').onclick=()=>{LS.set('url','');LS.set('pin','');LS.set('cache','');DATA=null;showConnect()};
  $('#tm-share').onclick=async()=>{const link=location.origin+location.pathname+'#connect?u='+encodeURIComponent(c.url)+'&p='+encodeURIComponent(c.pin);
    const text='KL App stock: open this link on your phone in Safari, then tap Share › Add to Home Screen.\n'+link;
    try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(text);toast('Link copied. Paste it into WhatsApp.')}catch(e){toast('Couldn’t share on this device')}}}
// ---------- boot ----------
const linked=readLink();
if(linked||location.hash==='#stock')show('stock');
try{const c=LS.get('cache');if(c){DATA=JSON.parse(c);updDot()}}catch(e){}
if(conn().url&&!linked&&location.hash!=='#stock')api().then(d=>{DATA=d;LS.set('cache',JSON.stringify(d));updDot()}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&conn().url&&!$('#view-stock').hidden)load()});
})();
</script>
